[package]
name = "editor-widgets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = false
description = "egui widgets: editor view, file tree, tab bar, palette, console"

[dependencies]
editor-core.workspace = true
editor-config.workspace = true
editor-syntax = { version = "1.0.1", path = "../syntax" }
eframe.workspace = true
editor-search = { version = "1.0.1", path = "../search" }
editor-proc = { version = "1.0.1", path = "../proc" }
trash = "5.2.6"
editor-lsp = { version = "1.0.1", path = "../lsp" }
# For `LineStatus` alone. The gutter draws what the diff decided; it does not
# run git, and nothing here spawns a process.
editor-vcs = { version = "1.0.1", path = "../vcs" }
# Re-exported by eframe; named here so the editor can describe itself to the
# accessibility tree, which a custom-painted widget has to do for itself.
accesskit = "0.24.1"

[dev-dependencies]
ropey.workspace = true

# A plain program rather than a harness: see the file's own explanation.
[[bench]]
name = "budgets"
harness = false

[lints]
workspace = true
