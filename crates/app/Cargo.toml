[package]
name = "the-editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = false
description = "The Editor - a cross-platform IDE for Python and Rust"

[[bin]]
name = "the-editor"
path = "src/main.rs"

[dependencies]
editor-config.workspace = true
editor-core.workspace = true
editor-debug.workspace = true
editor-lsp = { version = "1.0.0", path = "../lsp" }
editor-proc = { version = "1.0.0", path = "../proc" }
editor-search.workspace = true
editor-syntax.workspace = true
editor-widgets.workspace = true

anyhow.workspace = true
eframe = { workspace = true, features = ["glow"] }
nucleo-matcher.workspace = true
rfd.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
arboard = "3.6.1"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
# For parsing files the project-wide definition search reads off disk, which
# have no `Document` behind them.
ropey.workspace = true

[target.'cfg(windows)'.build-dependencies]
# Compiles the icon into the exe's resources, so Explorer, the taskbar and the
# Alt+Tab list show it instead of the generic application icon.
winresource = "0.1.24"

[lints]
workspace = true
