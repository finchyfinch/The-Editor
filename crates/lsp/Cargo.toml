[package]
name = "editor-lsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = false
description = "Language Server Protocol client, server lifecycle and diagnostic routing"

[dependencies]
anyhow.workspace = true
editor-core.workspace = true
# For `spawn::quiet`: a GUI process starting a console-subsystem child
# gives it a console window unless told not to, and a language server is
# long-lived, so the window stays for the session.
editor-proc = { version = "1.0.0", path = "../proc" }
lsp-types = "0.97.0"
serde.workspace = true
serde_json = "1.0.151"
tracing.workspace = true

[lints]
workspace = true
