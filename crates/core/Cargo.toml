[package]
name = "editor-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = false
description = "Text buffers, edits, undo history, selections and indentation for The Editor"

[dependencies]
anyhow.workspace = true
encoding_rs.workspace = true
ropey.workspace = true

[target.'cfg(windows)'.dependencies]
# Only for a file's hard-link count; see `save::link_count`. Already built for
# the GUI stack, so this adds nothing to compile.
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[lints]
workspace = true
