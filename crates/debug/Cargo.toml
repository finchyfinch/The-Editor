[package]
name = "editor-debug"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = false
description = "Debug Adapter Protocol client for The Editor"

[dependencies]
anyhow.workspace = true
# For `spawn::quiet`, so the adapter gets no console window.
editor-proc.workspace = true
# DAP frames its messages exactly as LSP does -- `Content-Length`, a blank
# line, then the JSON. Reusing that reader is better than a second copy of the
# same off-by-one bugs.
editor-lsp.workspace = true
serde.workspace = true
serde_json = "1.0.151"
tracing.workspace = true

[lints]
workspace = true
